# Installs the cask on a Mac and the formula on Linux, the way users do.

name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cask:
    runs-on: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew style wwhalefe/tap
      - run: brew audit --cask --strict --online wwhalefe/tap/flockswitch
      - run: brew install --cask wwhalefe/tap/flockswitch
      - run: test -d /Applications/flockswitch.app
      - run: flockswitch help
      - run: brew uninstall --cask --zap wwhalefe/tap/flockswitch

  usagemeter:
    runs-on: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew audit --cask --strict --online wwhalefe/tap/usagemeter
      - run: brew install --cask wwhalefe/tap/usagemeter
      - run: test -d /Applications/UsageMeter.app
      - run: lipo -archs /Applications/UsageMeter.app/Contents/MacOS/UsageMeter
      - run: brew uninstall --cask --zap wwhalefe/tap/usagemeter

  formula:
    runs-on: ubuntu-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew audit --formula --strict --online wwhalefe/tap/flockswitch
      - run: brew install --formula wwhalefe/tap/flockswitch
      - run: brew test wwhalefe/tap/flockswitch
      - run: test -f "$(brew --prefix)/share/applications/flockswitch.desktop"
      - run: brew uninstall --formula wwhalefe/tap/flockswitch

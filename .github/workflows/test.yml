# Installs the cask on a Mac and the formula on Linux, the way users do.

name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The cask audits skip `livecheck_version`: a push that lands before Bump has caught up
# with a new release would otherwise fail on "Version differs from livecheck". Bump runs
# every 30 minutes and owns version updates.

jobs:
  cask:
    runs-on: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew style wwhalefe/tap
      - run: brew audit --cask --strict --online --except=livecheck_version wwhalefe/tap/flockswitch
      - run: brew install --cask wwhalefe/tap/flockswitch
      - run: test -d /Applications/flockswitch.app
      - run: flockswitch help
      - run: brew uninstall --cask --zap wwhalefe/tap/flockswitch

  usagemeter:
    runs-on: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew audit --cask --strict --online --except=livecheck_version wwhalefe/tap/usagemeter
      - run: brew install --cask wwhalefe/tap/usagemeter
      - run: test -d /Applications/UsageMeter.app
      - run: lipo -archs /Applications/UsageMeter.app/Contents/MacOS/UsageMeter
      - run: brew uninstall --cask --zap wwhalefe/tap/usagemeter

  mdemo:
    runs-on: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew audit --cask --strict --online --except=livecheck_version wwhalefe/tap/mdemo
      - run: brew install --cask wwhalefe/tap/mdemo
      - run: test -d /Applications/MDemo.app
      - run: lipo -archs /Applications/MDemo.app/Contents/MacOS/MDemo
      - run: brew uninstall --cask --zap wwhalefe/tap/mdemo

  podlift:
    runs-on: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew audit --cask --strict --online --except=livecheck_version wwhalefe/tap/podlift
      - run: brew install --cask wwhalefe/tap/podlift
      - run: test -d /Applications/Podlift.app
      - run: lipo -archs /Applications/Podlift.app/Contents/MacOS/podlift
      - run: brew uninstall --cask --zap wwhalefe/tap/podlift

  formula:
    runs-on: ubuntu-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew audit --formula --strict --online wwhalefe/tap/flockswitch
      - run: brew install --formula wwhalefe/tap/flockswitch
      - run: brew test wwhalefe/tap/flockswitch
      - run: test -f "$(brew --prefix)/share/applications/flockswitch.desktop"
      - run: brew uninstall --formula wwhalefe/tap/flockswitch

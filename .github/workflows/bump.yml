# Follows new flockswitch releases: once a day, or by hand from the Actions tab.

name: Bump

on:
  schedule:
    # Often, so a release reaches `brew upgrade` soon after it is published.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # start test.yml after a bump

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point the cask and formula at the latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/bump.sh
      - name: Commit
        id: commit
        run: |
          git diff --quiet && { echo "already current"; exit 0; }
          mac=$(grep -m1 '^  version' Casks/flockswitch.rb | cut -d'"' -f2)
          linux=$(grep -m1 -o 'flockswitch-linux-x86_64-[0-9.]*[0-9]' Formula/flockswitch.rb | sed 's/.*-//')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "flockswitch: macOS $mac, Linux $linux"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # A push made with GITHUB_TOKEN starts no other workflow, so test here.
      - name: Test the updated files
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref main
